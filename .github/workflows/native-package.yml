name: Reusable OHOS native SDK

on:
  workflow_call:
    inputs:
      producer_repository:
        type: string
        default: Goodwu/libmpv-ohos-build
      producer_ref:
        description: Full producer commit; its source lock selects every dependency.
        type: string
        required: true
      media_kit_ref:
        description: Full media-kit commit providing the common package verifier.
        type: string
        required: true
      artifact_name:
        type: string
        default: native-ohos-arm64
    outputs:
      manifest_sha256:
        value: ${{ jobs.build.outputs.manifest_sha256 }}
      identity_sha256:
        value: ${{ jobs.build.outputs.identity_sha256 }}
      archive_sha256:
        value: ${{ jobs.build.outputs.archive_sha256 }}
  workflow_dispatch:
    inputs:
      producer_repository:
        default: Goodwu/libmpv-ohos-build
        required: true
        type: string
      producer_ref:
        description: Full producer commit
        required: true
        type: string
      media_kit_ref:
        description: Full media-kit commit with tool/native_package/package.py
        required: true
        type: string
      artifact_name:
        default: native-ohos-arm64
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      identity_sha256: ${{ steps.package.outputs.identity_sha256 }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    env:
      PRODUCER_REF: ${{ inputs.producer_ref }}
      MEDIA_KIT_REF: ${{ inputs.media_kit_ref }}
    steps:
      - name: Require immutable source selections
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PRODUCER_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MEDIA_KIT_REF" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.producer_repository }}
          ref: ${{ inputs.producer_ref }}
          path: producer
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Goodwu/media-kit
          ref: ${{ inputs.media_kit_ref }}
          path: package-tools
          persist-credentials: false
      - name: Read the checked-out lock
        id: lock
        working-directory: producer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCER_REF"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open("reproducibility/source-lock.json"))
          for name, value in (("sdk", lock["sdk"]["cli_version"]), ("meson", lock["tools"]["meson"])):
              if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)+", value):
                  raise SystemExit("Invalid locked tool version")
              print(f"{name}={value}")
          PY
      - name: Install native build tools
        env:
          MESON_VERSION: ${{ steps.lock.outputs.meson }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake gperf libtool ninja-build pkg-config python3-venv ripgrep unzip zip
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/python" -m pip install --disable-pip-version-check "meson==$MESON_VERSION"
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
      - name: Set up the locked HarmonyOS SDK
        uses: ErBWs/setup-ohos@5c8e74d05fc9888a387b6154ba06d0cd9ede3da1
        with:
          version: ${{ steps.lock.outputs.sdk }}
          cache: true
      - name: Validate producer gates
        working-directory: producer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build locked sources with WebP support
        working-directory: producer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x *.sh download/*.sh scripts/*.sh
          ./bundle.sh
      - name: Export and verify the complete native package
        id: package
        working-directory: producer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_native.py \
            --output "$RUNNER_TEMP/native-package" \
            --spec "$RUNNER_TEMP/native-package-spec.json"
          python3 ../package-tools/tool/native_package/package.py create \
            --root "$RUNNER_TEMP/native-package" \
            --spec "$RUNNER_TEMP/native-package-spec.json" \
            > "$RUNNER_TEMP/native-package-receipt.json"
          manifest_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_sha256"])' "$RUNNER_TEMP/native-package-receipt.json")
          python3 ../package-tools/tool/native_package/package.py verify \
            --root "$RUNNER_TEMP/native-package" --manifest-sha256 "$manifest_sha" --platform ohos
          tar -C "$RUNNER_TEMP/native-package" -czf "$RUNNER_TEMP/native-package.tar.gz" .
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          receipt = json.loads((root / "native-package-receipt.json").read_text())
          with (root / "native-package.tar.gz").open("rb") as source:
              receipt["archive_sha256"] = hashlib.file_digest(source, "sha256").hexdigest()
          (root / "native-package-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          for name in ("manifest_sha256", "identity_sha256", "archive_sha256"):
              print(f"{name}={receipt[name]}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_name }}
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/native-package.tar.gz
            ${{ runner.temp }}/native-package-receipt.json
            ${{ runner.temp }}/native-package-spec.json
