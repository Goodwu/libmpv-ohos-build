name: build libmpv for ohos

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y gperf git jq meson ninja-build pkg-config unzip zip
      - name: Set up HarmonyOS SDK
        uses: ErBWs/setup-ohos@5c8e74d05fc9888a387b6154ba06d0cd9ede3da1
        with:
          version: 26.0.0.621
          cache: true

      - name: Bundle
        run: |
          chmod +x *.sh */*.sh scripts/*.sh
          ./bundle.sh
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            ./libmpv/arm64-build/*.zip
            ./libmpv/arm64-build/libmpv.so
            ./libmpv/arm64-build/manifest.json
            ./libmpv/arm64-build/sbom.cdx.json
            ./libmpv/arm64-build/SHA256SUMS

      - name: Verify metadata and checksums
        run: |
          set -euo pipefail
          python3 -m json.tool reproducibility/source-lock.json >/dev/null
          python3 -m json.tool libmpv/arm64-build/manifest.json >/dev/null
          python3 -m json.tool libmpv/arm64-build/sbom.cdx.json >/dev/null
          (cd libmpv/arm64-build && sha256sum -c SHA256SUMS)
