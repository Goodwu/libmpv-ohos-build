name: build libmpv for ohos

on:
  pull_request:
  push:
    tags:
      - '20[0-9][0-9][0-9][0-9][0-9][0-9]'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y gperf git jq ninja-build pkg-config python3-venv ripgrep unzip zip
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/python" -m pip install --disable-pip-version-check --no-cache-dir meson==1.6.1
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/meson/bin/meson" --version
      - name: Set up HarmonyOS SDK
        uses: ErBWs/setup-ohos@5c8e74d05fc9888a387b6154ba06d0cd9ede3da1
        with:
          version: 26.0.0.621
          cache: true

      - name: Bundle
        run: |
          chmod +x *.sh */*.sh scripts/*.sh
          ./bundle.sh
        shell: bash

      - name: Verify metadata and checksums
        run: |
          set -euo pipefail
          python3 -m json.tool reproducibility/source-lock.json >/dev/null
          python3 -m json.tool libmpv/arm64-build/manifest.json >/dev/null
          python3 -m json.tool libmpv/arm64-build/sbom.cdx.json >/dev/null
          (cd libmpv/arm64-build && sha256sum -c SHA256SUMS)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            ./libmpv/arm64-build/*.zip
            ./libmpv/arm64-build/libmpv.so
            ./libmpv/arm64-build/manifest.json
            ./libmpv/arm64-build/sbom.cdx.json
            ./libmpv/arm64-build/SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: libmpv-ohos ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Reproducible OHOS ARM64 build for immutable tag `${{ github.ref_name }}`.

            - Commit: `${{ github.sha }}`
            - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            ./libmpv/arm64-build/*.zip
            ./libmpv/arm64-build/SHA256SUMS
