name: Native media feature guards
on:
  push:
    paths: ['scripts/**', 'reproducibility/**', '.github/workflows/media-features.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v
      - run: bash -n scripts/libwebp.sh scripts/ffmpeg.sh download/download-libwebp.sh
